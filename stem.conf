# STEM configuration
# =============================================================================
# Easy plaintext config: key = value, # comments, blank lines ignored.
# For complex/structured config, use JSON: ~/.config/stem/stem.json
#
# Locations (first found wins unless STEM_CONF is set):
#   $STEM_CONF
#   $XDG_CONFIG_HOME/stem/stem.conf
#   ~/.config/stem/stem.conf
#   ~/.config/stem/stem.json
#   ~/.config/stem/config
#   ~/.config/stem/config.json
#
# STEM creates ~/.config/stem/stem.conf on first launch if missing.
# Reload live (where supported): bind.reload_config = ctrl+shift+r
# Validate: stemctl doctor
# -----------------------------------------------------------------------------

# -- Includes / profiles / themes ---------------------------------------------
# include = ~/.config/stem/local.conf
# include_file = ~/.config/stem/overrides.conf
# theme_file = ~/.config/stem/themes/krypton.conf
# profile_file = ~/.config/stem/profiles/dev.conf
# profile = default
theme = krypton

# -- Splits / layout ---------------------------------------------------------
unfocused_split_opacity = 0.92     # reserved/future visual dimming

# -- Window / Hyprland --------------------------------------------------------
title = STEM
title_includes_cwd = true
app_id = stem                      # Wayland app_id / WM_CLASS; use in Hyprland rules
window_title = STEM                # alias
cols = 120
rows = 32
width = 1200                       # px hint where supported
height = 720                       # px hint where supported
minimum_width = 480
minimum_height = 280
padding = 10                       # px around terminal grid
padding_x = 10                     # horizontal padding (px)
padding_y = 10                     # vertical padding (px)
window_padding_balance = false     # reserved/future
opacity = 0.95                     # 0.0-1.0; compositor may also control transparency
background_opacity = 0.95          # alias/future
blur = false                       # compositor hint
decorations = true                 # server-side decorations hint where supported
always_on_top = false
start_fullscreen = false
center_on_launch = true
confirm_close = false
confirm_close_surface = false      # alias/future per-surface policy
quit_after_last_window_closed = false # reserved/future              # prompt before closing a live window
window_shadow = true
appearance = dark                  # auto | dark | light
titlebar_transparent = true        # macOS/native hint

# Hyprland tips (see contrib/hyprland/stem-rules.conf):
# windowrulev2 = opacity 0.96 0.92,class:^(stem)$

# -- Shell / session ----------------------------------------------------------
# shell = /bin/zsh                 # empty = platform default ($SHELL on Linux)
shell_command =                    # alias
working_directory = ~
cwd = ~                            # alias
term = xterm-256color
login_shell = false
shell_integration = true
shell_integration_features = cursor,title,cwd,prompt # reserved/future fine-grained           # OSC 7/133 hooks/env
command_history = true             # terminal-side command capture/history file
history_file = ~/.config/stem/history
history_max_entries = 10000
restore_session = true
session_file = ~/.config/stem/session.conf
confirm_exit = false               # alias
initial_command =                  # command to run after shell starts
env_TERM =                         # reserved/future env override

# -- Font / text --------------------------------------------------------------
font = MesloLGS Nerd Font
font_family = MesloLGS Nerd Font, JetBrainsMono Nerd Font, CaskaydiaCove Nerd Font, monospace
font_size = 13.5
font_weight = normal
font_weight_bold = bold
line_height = 1.0
adjust_cell_width = 0              # reserved/future renderer cell tuning
adjust_cell_height = 0             # reserved/future renderer cell tuning
line_spacing = 0
letter_spacing = 0
bold_is_bright = true
ligatures = true                   # reserved/future (bitmap renderer currently)
font_fallback = true               # reserved/future
font_features =                    # reserved/future (OpenType features)
scrollbar = true

# -- Cursor / bell / selection / input ----------------------------------------
cursor_style = bar                 # bar | block | underline
cursor_blink = true
cursor_blink_ms = 530              # 0 = steady
cursor_color = #8B5CF6
selection_foreground =             # empty = auto contrast
selection_background = #3A2A60
copy_on_select = false
right_click_action = context-menu  # reserved/future
paste_protection = true
osc52_clipboard = ask              # allow | ask | deny
mouse = true
mouse_hide_while_typing = true
focus_follows_mouse = false
bell = visual                      # visual | audible | off
audible_bell = false               # alias/future
visual_bell = true                 # alias/future

# -- Scrollback / search ------------------------------------------------------
scrollback = 10000
scrollback_lines = 10000           # alias
scroll_multiplier = 3
mouse_scroll_multiplier = 3        # alias
scrollback_limit = 10000000        # reserved/future bytes/lines cap policy
search_wrap = true
search_case_sensitive = false

# -- Keybindings --------------------------------------------------------------
# Format: bind.<action> = <key combo>
# Modifiers: ctrl, shift, alt, super. Keys: letters, numbers, pageup, pagedown,
# home, end, plus, minus, enter, esc, tab, space, backspace.
bind.copy = ctrl+shift+c
bind.paste = ctrl+shift+v
bind.search = ctrl+shift+f
bind.reload_config = ctrl+shift+r
bind.new_window = ctrl+shift+n
bind.new_tab = ctrl+shift+t        # reserved/future (Wayland tabs)
bind.split_right = ctrl+shift+d
bind.split_down = ctrl+shift+e
bind.focus_next_pane = ctrl+shift+o
bind.close_pane = ctrl+shift+x
bind.close_window = ctrl+shift+w
bind.split_equalize = ctrl+shift+equal
bind.split_grow = ctrl+shift+period
bind.split_shrink = ctrl+shift+comma
bind.swap_panes = ctrl+shift+s
bind.zoom_in = ctrl+plus
bind.zoom_out = ctrl+minus
bind.zoom_reset = ctrl+0
bind.scroll_page_up = shift+pageup
bind.scroll_page_down = shift+pagedown
bind.scroll_top = shift+home
bind.scroll_bottom = shift+end
bind.jump_to_prompt = ctrl+shift+up
bind.command_history = ctrl+shift+h
bind.command_palette = ctrl+shift+p
bind.clear_scrollback = ctrl+shift+k
bind.open_config = ctrl+shift+i
bind.toggle_fullscreen = f11

# -- Plugins / extensions -----------------------------------------------------
plugins_enabled = true
plugin_dir = ~/.config/stem/plugins
plugin_manifest = ~/.config/stem/plugins/manifest.toml
plugin_event_format = text         # text | json
plugin_timeout_ms = 2000           # reserved/future
plugin_allow_network = false       # advisory
plugin_allow_filesystem = true     # advisory
plugin_allow_exec = true           # advisory

# -- Automation / control plane -----------------------------------------------
control_enabled = true
control_file = ~/.config/stem/ctl
control_socket = ~/.config/stem/stem.sock
stemctl_enabled = true
allow_remote_control = false       # reserved/future

# -- Hyprland integration -----------------------------------------------------
hyprland_ipc = true
hyprland_auto_rules = false
hyprland_scratchpad_app_id = stem-float
hyprland_dispatch_on_startup =     # reserved/future
hyprland_dispatch_on_cwd =         # reserved/future

# -- Rendering / performance / diagnostics ------------------------------------
renderer = cpu                     # cpu | gpu | auto (gpu falls back to cpu)
damage_tracking = true
fps_overlay = false
debug_overlay = false
perf_log = false
perf_log_file = ~/.config/stem/perf.log
max_fps = 120
vsync = true
gpu_backend = auto                 # auto | vulkan | opengl | metal | d3d

# -- Protocol / compatibility -------------------------------------------------
osc52_clipboard = ask              # allow | ask | deny
hyperlinks = true                  # OSC 8
kitty_keyboard = false             # basic CSI u encoding when enabled
synchronized_output = true         # DEC 2026 basic buffering
bracketed_paste = true
focus_reporting = true
mouse_reporting = true
grapheme_clusters = true           # basic combining-char handling in engine
ligatures_enabled = false          # bitmap renderer limitation; config wired

# -- Colors / theme -----------------------------------------------------------
background = #05070C
bg = #05070C                       # alias
foreground = #D8DAD4
fg = #D8DAD4                       # alias
accent = #8B5CF6
split_divider_color = #8B5CF6
unfocused_pane_opacity = 0.82

# ANSI 16-color palette
color0 = #1E1E1E
color1 = #F14C4C
color2 = #23D18B
color3 = #F5F543
color4 = #3B8EEA
color5 = #D670D6
color6 = #29B8DB
color7 = #E5E5E5
color8 = #666666
color9 = #F14C4C
color10 = #23D18B
color11 = #F5F543
color12 = #3B8EEA
color13 = #D670D6
color14 = #29B8DB
color15 = #FFFFFF


# -- Compatibility / extra config keys (accepted, partial, or reserved) -------
word_separators = " -_@/:.,;()[]{}<>'\""
cursor_click_to_move = false       # reserved/future
mouse_shift_capture = true         # shift bypasses app mouse reporting
focus_follows_mouse = false        # reserved/future
window_step_resize = false         # reserved/future
window_position =                  # reserved/future
window_save_state = default        # reserved/future
quick_terminal_position = top      # reserved/future
quick_terminal_size = 50%          # reserved/future
shell_integration = detect         # true|false|detect (detect treated as true)
term = xterm-256color              # TERM value
enquiry_response =                 # reserved/future
title_report = false               # reserved/future (CSI t reports)
image_protocol = false             # reserved/future (kitty/sixel)
sixel = false                      # reserved/future
vt_kam = true                      # reserved/future
vt_decscusr = true                 # cursor shape sequences
vt_decrqm = partial                # reserved/future
# Extended palette (optional; 16-255 reserved/future explicit overrides)
# color16 = #000000
# color255 = #EEEEEE
