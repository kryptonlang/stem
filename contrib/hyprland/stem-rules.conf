# STEM Hyprland integration
# Add to ~/.config/hypr/hyprland.conf:
#   source = ~/.config/stem/hyprland.conf
# Or copy these rules directly.

# Recommended window rules for STEM on Hyprland
windowrulev2 = opacity 0.96 0.92,class:^(stem)$
windowrulev2 = animation slide,class:^(stem)$
windowrulev2 = rounding 12,class:^(stem)$

# Float variant (launch with app_id stem-float via config or wrapper)
windowrulev2 = float,class:^(stem-float)$
windowrulev2 = center,class:^(stem-float)$
windowrulev2 = size 1100 720,class:^(stem-float)$

# Optional: blur behind transparent STEM
# decoration {
#     blur {
#         enabled = true
#         size = 6
#         passes = 3
#     }
# }